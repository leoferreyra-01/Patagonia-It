name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  init:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Archive dependencies
        run: tar -czf node-modules.tar.gz node_modules

      - name: Upload dependencies artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-modules
          path: node-modules.tar.gz
          if-no-files-found: error

  test:
    needs: init
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Download dependencies artifact
        uses: actions/download-artifact@v8
        with:
          name: node-modules
          path: .

      - name: Extract dependencies
        run: tar -xzf node-modules.tar.gz

      - name: Run unit and e2e tests
        run: npm run test

      - name: Run coverage
        run: npm run test:cov

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  release-gate:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      valid_tag: ${{ steps.tag_check.outputs.valid_tag }}

    steps:
      - name: Validate release tag format
        id: tag_check
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/* ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "valid_tag=true" >> "$GITHUB_OUTPUT"
            else
              echo "valid_tag=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "valid_tag=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs:
      - test
      - release-gate
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || needs.release-gate.outputs.valid_tag == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - name: Download dependencies artifact
        uses: actions/download-artifact@v8
        with:
          name: node-modules
          path: .

      - name: Extract dependencies
        run: tar -xzf node-modules.tar.gz

      - name: Build
        run: npm run build

  deploy:
    needs:
      - build
      - release-gate
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || needs.release-gate.outputs.valid_tag == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy placeholder
        run: echo "Deploy stage placeholder - no deployment configured yet."
